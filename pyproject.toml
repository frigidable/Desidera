[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desidera"
version = "0.2.0"
description = "DESIDERA: experimental galaxy workbench for Legacy FITS/WCS and research QA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
astro = ["astropy>=6.0"]
exact = ["astropy>=6.0", "photutils>=2.0"]
demo = ["matplotlib"]
gui = ["PySide6>=6.6", "astropy>=6.0"]
knowledge = ["astropy>=6.0", "astroquery>=0.4.8"]
test = ["pytest"]

[project.scripts]
desidera = "desidera.cli:main"
desidera-gui = "desidera.gui:main"
desidera-survey-gui = "lsbpipe.gui.survey_explorer:main"
# Compatibility entry points for existing workflows.
lsbpipe = "lsbpipe.cli:main"
lsbpipe-survey-gui = "lsbpipe.gui.survey_explorer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
