name: UI baseline — offline Qt captures

on:
  pull_request:
    # GUI actions execute the complete scientific suite too. Any changes
    # to its imported source, tests or fixture/scripts must invalidate this
    # check; the former whitelist missed e.g. background.py and scene.py.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded screenshot/science runs for the same PR, as the
# scientific matrix already does; do not build many stale GUI artifacts.
concurrency:
  group: ui-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gui-baseline:
    name: Windows PySide6 offline screenshot evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag resolved 2026-11-13
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 tag resolved 2026-11-13
        with:
          python-version: "3.12"
      - name: Install declared GUI and test dependencies
        run: python -m pip install -e ".[exact,gui,test,test-gui]"
      - name: Check installed package dependency compatibility
        run: python -m pip check
      - name: Scientific regression suite
        run: python -m pytest -q tests --ignore=tests/gui
      # The full native-FITS E2E starts Qt, Astropy FITS/WCS and multiple
      # scientific worker threads. Give it an isolated Qt/Python process:
      # global font registration and Qt object destruction must not inherit
      # the state of hundreds of unrelated GUI tests.
      - name: Offline GUI smoke tests
        run: python -m pytest -q tests/gui --ignore=tests/gui/test_native_fits_photometry_e2e_gui.py
      - name: Native FITS photometry GUI E2E (isolated Qt process)
        env:
          DESIDERA_E2E_SCREENSHOT_DIR: gui-artifacts/native-fits
        run: python -m pytest -q tests/gui/test_native_fits_photometry_e2e_gui.py
      - name: Capture GUI baseline (remote Viewer substituted offline)
        if: always()
        run: python scripts/capture_gui_baseline.py --output-dir gui-artifacts
      - name: Capture Photometry Workspace preparation states
        if: always()
        run: python scripts/capture_photometry_workspace.py --output-dir gui-artifacts/photometry
      - name: Publish screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag resolved 2026-11-13
        with:
          name: lsbpipe-gui-baseline-${{ github.run_id }}
          path: gui-artifacts/
          if-no-files-found: warn
          retention-days: 30
