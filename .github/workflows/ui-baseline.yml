name: UI baseline — offline Qt captures

on:
  pull_request:
    # GUI actions execute the complete scientific suite too. Any changes
    # to its imported source, tests or fixture/scripts must invalidate this
    # check; the former whitelist missed e.g. background.py and scene.py.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - "docs/ux/**"
      - ".github/workflows/ui-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded screenshot/science runs for the same PR, as the
# scientific matrix already does; do not build many stale GUI artifacts.
concurrency:
  group: ui-baseline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gui-baseline:
    name: Windows PySide6 offline screenshot evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared GUI and test dependencies
        run: python -m pip install -e ".[exact,gui,test,test-gui]"
      - name: Check installed package dependency compatibility
        run: python -m pip check
      - name: Scientific regression suite
        run: python -m pytest -q tests --ignore=tests/gui
      - name: Offline GUI smoke tests
        run: python -m pytest -q tests/gui
      - name: Capture GUI baseline (remote Viewer substituted offline)
        if: always()
        run: python scripts/capture_gui_baseline.py --output-dir gui-artifacts
      - name: Capture Photometry Workspace preparation states
        if: always()
        run: python scripts/capture_photometry_workspace.py --output-dir gui-artifacts/photometry
      - name: Publish screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsbpipe-gui-baseline-${{ github.run_id }}
          path: gui-artifacts/
          if-no-files-found: warn
          retention-days: 30
