name: P0.6c real Legacy CCD archive acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/accept_legacy_ccd_archives.py"
      - "tests/test_real_legacy_ccd_acceptance.py"
      - ".github/workflows/legacy-ccd-real-archive.yml"

permissions:
  contents: read

jobs:
  real-archive-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[astro,test]"
      - name: Validate acceptance runner without network
        run: python -m pytest -q tests/test_real_legacy_ccd_acceptance.py
      - name: Inspect actual FITS coordinate ranges and north directory
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from io import BytesIO
          import re
          from astropy.io import fits
          base = "https://portal.nersc.gov/cfs/cosmo/data/legacysurvey"
          for rel in ("dr9", "dr11"):
              url = f"{base}/{rel}/south/coadd/155/1554p180/legacysurvey-1554p180-ccds.fits"
              try:
                  with urlopen(url, timeout=40) as response:
                      content = response.read()
                  with fits.open(BytesIO(content)) as hdus:
                      table = next(h for h in hdus if isinstance(h, fits.BinTableHDU))
                      print(rel, "ROWS", len(table.data), flush=True)
                      for col in ("BRICK_X0","BRICK_X1","BRICK_Y0","BRICK_Y1"):
                          a = table.data[col]
                          print(rel, col, "MIN", int(min(a)), "MAX", int(max(a)),
                                "NEGATIVE", sum(int(v < 0) for v in a), flush=True)
              except Exception as exc:
                  print(rel, "DIAGNOSTIC_ERROR", repr(exc), flush=True)
          url = f"{base}/dr9/north/coadd/210/"
          try:
              with urlopen(url, timeout=40) as response:
                  html = response.read().decode("utf-8", "replace")
              print("NORTH_DIRECTORY", url, "FIRST_LINKS",
                    re.findall(r'href=["\\\']([^"\\\']+)', html)[:60], flush=True)
          except Exception as exc:
              print("NORTH_DIRECTORY_ERROR", repr(exc), flush=True)
          PY
      - name: Fetch official DR9 DR11 original FITS and audit
        run: python scripts/accept_legacy_ccd_archives.py --report-dir real-ccd-evidence
      - name: Preserve actual evidence even when audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desidera-p06c-archive-${{ github.run_id }}
          path: real-ccd-evidence/
          if-no-files-found: warn
          retention-days: 90
