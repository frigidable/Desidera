name: Survey Explorer tests

on:
  push:
    branches:
      - main
  pull_request:
    # Any Python source or test change must exercise the scientific suite.
    # In particular, core photometry/background changes must not bypass CI.
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/survey-tests.yml"

permissions:
  contents: read

concurrency:
  group: survey-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  science-core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific tests
        run: python -m pip install -e ".[exact,demo,test]"
      - name: Run complete offline test suite
        run: python -m pytest -q

  gui-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install GUI optional dependencies
        run: python -m pip install -e ".[gui,test]"
      - name: Verify GUI import without launching a display
        run: python -c "from lsbpipe.gui.survey_explorer import SurveyExplorer; print(SurveyExplorer.__name__)"
      - name: Verify official Viewer GUI integration contracts
        run: python -m pytest -q tests/test_survey_aladin_bootstrap.py tests/test_survey_viewer.py
